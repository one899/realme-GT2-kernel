name:SM8350 - realme GT/GT2 AndroidU

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-kernel:
    name: ${{ matrix.device_name }} - ${{ matrix.name }} - ${{ matrix.author }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: "https://github.com/realme-kernel-opensource/realme_gt2-realme_gt-AndroidU-kernel-source.git"
            modules_repo: "https://github.com/realme-kernel-opensource/realme_gt2_realme_gt-AndroidU-vendor-source.git"
            command: "LLVM=1 LLVM_IAS=1"
            branch: "master"
            modules_branch: "master"
            name: "original"
            author: "JackA1ltman-chippa-a"
            device_name: "realme-gt"
            device: "realme-gt-androidu"
            defconfig: "gki_defconfig"
            vendor_fragment: "vendor/lahaina_QGKI.config"
            device_codename: "riven"
            ksu: true
            kpm: false
          - repo: "https://github.com/realme-kernel-opensource/realme_gt2-realme_gt-AndroidU-kernel-source.git"
            modules_repo: "https://github.com/realme-kernel-opensource/realme_gt2_realme_gt-AndroidU-vendor-source.git"
            command: "LLVM=1 LLVM_IAS=1"
            branch: "master"
            modules_branch: "master"
            name: "original"
            author: "JackA1ltman-chippa-a"
            device_name: "realme-gt2"
            device: "realme-gt2-androidu"
            defconfig: "gki_defconfig"
            vendor_fragment: "vendor/lahaina_QGKI.config"
            device_codename: "porsche"
            ksu: true
            kpm: false
      fail-fast: false
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove useless tools
        run: |
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install necessary packages
        run: |
          sudo apt update
          sudo apt install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make optipng  maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler cpio coccinelle -y
          sudo apt-get install zstd libc6 binutils libc6-dev-i386 gcc g++ p7zip p7zip-full -y

          # Install Libtinfo5
          curl -C - --progress-bar -L http://launchpadlibrarian.net/580830584/libtinfo5_6.3-2_amd64.deb -o libtinfo5.deb
          sudo apt install ./libtinfo5.deb
          rm -f libtinfo5.deb

          sudo apt install python3 -y
          sudo rm -rf /usr/bin/python
          sudo ln -s /usr/bin/python3 /usr/bin/python

      - name: Get build tools
        run: |
          cd $GITHUB_WORKSPACE

          git clone "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git" -b "android12L-release" gcc-64 --depth=1
          git clone "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git" -b "android12L-release" gcc-32 --depth=1

          git clone "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/clang-r450784d" -b "master" "clang-custom" --depth 1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-${{ matrix.device_codename }}
          max-size: 2G

      - name: Get Kernel and Vendor modules
        run: |
          cd $GITHUB_WORKSPACE
          git clone -b "${{ matrix.branch }}" "${{ matrix.repo }}" kernel/msm-5.4 --depth 1
          git clone -b "${{ matrix.modules_branch }}" "${{ matrix.modules_repo }}" modules --depth 1

          # vendor 目录合并到 workspace 根（arch/arm64/boot/dts/vendor 符号链接指向此处）
          mv modules/vendor ./
          # techpack 合并到内核源码树
          cp -r modules/kernel/msm-5.4/techpack/* kernel/msm-5.4/techpack/
          rm -rf modules

          if [[ "${{ matrix.ksu }}" == "true" ]]; then
            echo "KSU_NAME=-ksu" >> $GITHUB_ENV

            cd kernel/msm-5.4

            curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
            echo "CONFIG_KSU=y" >> ./arch/arm64/configs/${{ matrix.defconfig }}
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./arch/arm64/configs/${{ matrix.defconfig }}
            curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/syscall_hook_patches.sh" | bash -s

            if [[ "${{ matrix.kpm }}" == "true" ]]; then
                echo "KPM_NAME=-kpm" >> $GITHUB_ENV

                echo "CONFIG_KPM=y" >> ./arch/arm64/configs/${{ matrix.defconfig }}
                echo "CONFIG_KALLSYMS=y" >> ./arch/arm64/configs/${{ matrix.defconfig }}
                echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/arm64/configs/${{ matrix.defconfig }}
                curl "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
                chmod +x patch
            fi
          else
            echo "KSU_NAME=" >> $GITHUB_ENV
          fi

      - name: Get Packing Tools
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          git clone "https://github.com/osm0sis/AnyKernel3.git" -b "master" Anykernel3 --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-5.4

          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH

          # 1. 生成 defconfig
          make CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=realme ${{ matrix.command }} CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- ${{ matrix.defconfig }}

          # 2. 合并 vendor QGKI fragment（NonGKI 方式）
          ./scripts/kconfig/merge_config.sh -m -O out arch/arm64/configs/${{ matrix.vendor_fragment }}

          # 3. 追加 BPF CONFIG（KSU 已在 defconfig 追加）
          cat >> out/.config <<EOF
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          EOF

          # 4. olddefconfig 使配置一致
          make CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=realme ${{ matrix.command }} CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- olddefconfig

          # 5. 编译
          make -j$(nproc --all) CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=realme ${{ matrix.command }} STRIP=llvm-strip CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- O=out ARCH=arm64 2>&1|tee error.log

          if [[ "${{ matrix.kpm }}" == "true" ]]; then

            cp patch out/arch/arm64/boot/
            cd out/arch/arm64/boot/
            ./patch
            rm -f Image
            mv oImage Image
          fi

          cat $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/dts/vendor/oplus/${{ matrix.device_codename }}/*.dtb > $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/dts/vendor/oplus/${{ matrix.device_codename }}/dtb

      - name: Make Anykernel3 - Perfix
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-5.4

          sed -i 's/ExampleKernel by osm0sis @ xda-developers/realme AndroidU NonGKI Kernel Build by JackAltman @ Github/g' Anykernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh

      - name: Make Anykernel3 Flasher - NoDTB
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")

          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          mkdir -p tmp

          cp -fp $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/Image tmp

          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ matrix.device }}-${{ matrix.author }}-${{ matrix.name }}-$TIME${{ env.KPM_NAME }}${{ env.KSU_NAME }}.zip
          rm -rf tmp

          echo "PACK_NAME=${{ matrix.device }}-${{ matrix.author }}-${{ matrix.name }}-$TIME${{ env.KPM_NAME }}${{ env.KSU_NAME }}.zip" >> $GITHUB_ENV

      - name: Make Anykernel3 Flasher - DTB
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")

          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          mkdir -p tmp

          cp -fp $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/Image tmp
          cp -fp $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/dts/vendor/oplus/${{ matrix.device_codename }}/dtb tmp
          cp -fp $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/dts/vendor/oplus/${{ matrix.device_codename }}/dtbo.img tmp || true

          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ matrix.device }}-${{ matrix.author }}-${{ matrix.name }}-$TIME${{ env.KPM_NAME }}${{ env.KSU_NAME }}-DTB.zip
          rm -rf tmp

          echo "PACK_NAME_DTB=${{ matrix.device }}-${{ matrix.author }}-${{ matrix.name }}-$TIME${{ env.KPM_NAME }}${{ env.KSU_NAME }}-DTB.zip" >> $GITHUB_ENV

      - name: Upload Build Artifacts For Anykernel3
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.device }}-${{ matrix.author }}-${{ matrix.name }}
          path: |
            kernel/msm-5.4/${{ env.PACK_NAME }}
            kernel/msm-5.4/${{ env.PACK_NAME_DTB }}
